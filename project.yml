# İsteğe bağlı: Xcode 16'dan eski bir sürüm kullanıyorsanız projeyi XcodeGen ile yeniden üretebilirsiniz:
#   brew install xcodegen && xcodegen generate
name: InsaatSoft
options:
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: tr
targets:
  InsaatSoft:
    type: application
    platform: iOS
    sources:
      - path: InsaatSoft
    info:
      path: Support/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kavissoft.insaatsoft.ios
        PRODUCT_NAME: InsaatSoft
        MARKETING_VERSION: 1.1.0
        CURRENT_PROJECT_VERSION: 2
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Support/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
